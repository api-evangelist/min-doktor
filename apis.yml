name: Min Doktor
description: >-
  Min Doktor is a Swedish digital healthcare provider (operated by MD
  International AB) offering online primary care through its mobile app and web
  service. Founded in 2013 as one of Sweden's first digital-first care providers,
  it connects patients with doctors, psychologists and nurses for consultations,
  prescriptions, referrals and vaccinations, and also runs white-label care
  services for partners such as Skandia. It was surfaced as a portfolio company
  of EQT Ventures. Min Doktor operates as a consumer/patient-facing service and
  does not publish a public developer API or documentation surface; this profile
  captures its verifiable public security, identity and compliance footprint.
